[package]
name = "llmrc-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "MCP tool bridge and client transports for llmrc"
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories.workspace = true
keywords = ["llm", "mcp", "ai", "tools", "jsonrpc"]

[features]
default = ["transports"]
transports = []
rmcp = ["dep:rmcp", "dep:rmcp-reqwest"]

[dependencies]
async-trait.workspace = true
llmrc-agent = { path = "../agent", version = "0.1.0" }
llmrc-core = { path = "../core", version = "0.1.0" }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The stdio transport spawns child processes and reads their output, so this
# crate needs `process` and `io-util` on top of the workspace defaults. Without
# them it only compiled inside the workspace, where another crate enabled those
# features by unification, and `cargo publish` rejected the packaged tarball.
tokio = { workspace = true, features = ["io-util", "process"] }
tokio-util.workspace = true
rmcp = { version = "3.3", default-features = false, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
], optional = true }
rmcp-reqwest = { package = "reqwest", version = "0.13", default-features = false, features = [
    "rustls",
    "json",
    "stream",
], optional = true }
