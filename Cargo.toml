[package]
name = "llmrc"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A predictable, modular LLM provider facade for Rust"
license = "MIT"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[workspace]
members = [
    ".",
    "crates/core",
    "crates/runtime",
    "crates/agent",
    "crates/mcp",
    "crates/bots-core",
    "crates/bots-discord",
    "crates/bots-telegram",
    "crates/bots-slack",
    "crates/provider-openai",
    "crates/provider-ollama",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/wkqco33/llmrc"
homepage = "https://github.com/wkqco33/llmrc"
keywords = ["llm", "ai", "openai", "ollama", "mcp"]
categories = [
    "api-bindings",
    "asynchronous",
    "concurrency",
    "web-programming::http-client",
    "rust-patterns",
]

[workspace.dependencies]
async-openai = { version = "0.42", default-features = false, features = ["chat-completion", "embedding", "rustls"] }
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
ollama-rs = { version = "0.3.6", default-features = false, features = ["stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.2"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[features]
default = []
openai = ["dep:llmrc-openai"]
azure = ["dep:llmrc-openai"]
ollama = ["dep:llmrc-ollama"]
mcp = ["dep:llmrc-mcp"]
bots = ["dep:llmrc-bots-core"]
discord = ["bots", "dep:llmrc-bots-discord"]
telegram = ["bots", "dep:llmrc-bots-telegram"]
slack = ["bots", "dep:llmrc-bots-slack"]
serenity = ["discord"]
teloxide = ["telegram"]
slack-morphism = ["slack"]

[dependencies]
llmrc-core = { path = "crates/core", version = "0.1.0" }
llmrc-runtime = { path = "crates/runtime", version = "0.1.0" }
llmrc-agent = { path = "crates/agent", version = "0.1.0" }
llmrc-openai = { path = "crates/provider-openai", version = "0.1.0", optional = true }
llmrc-ollama = { path = "crates/provider-ollama", version = "0.1.0", optional = true }
llmrc-mcp = { path = "crates/mcp", version = "0.1.0", optional = true }
llmrc-bots-core = { path = "crates/bots-core", version = "0.1.0", optional = true }
llmrc-bots-discord = { path = "crates/bots-discord", version = "0.1.0", optional = true }
llmrc-bots-telegram = { path = "crates/bots-telegram", version = "0.1.0", optional = true }
llmrc-bots-slack = { path = "crates/bots-slack", version = "0.1.0", optional = true }

[dev-dependencies]
async-trait.workspace = true
futures.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[[example]]
name = "01_basic_agent"

[[example]]
name = "02_custom_tools"

[[example]]
name = "03_bot_conversation"
required-features = ["bots"]

[[example]]
name = "04_streaming_and_retry"
