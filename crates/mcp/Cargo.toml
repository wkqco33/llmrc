[package]
name = "llmrc-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "MCP tool bridge and client transports for llmrc"
license.workspace = true

[features]
default = ["transports"]
transports = []
rmcp = ["dep:rmcp", "dep:rmcp-reqwest"]

[dependencies]
async-trait.workspace = true
llmrc-agent = { path = "../agent", version = "0.1.0" }
llmrc-core = { path = "../core", version = "0.1.0" }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
rmcp = { version = "3.3", default-features = false, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
], optional = true }
rmcp-reqwest = { package = "reqwest", version = "0.13", default-features = false, features = [
    "rustls",
    "json",
    "stream",
], optional = true }
